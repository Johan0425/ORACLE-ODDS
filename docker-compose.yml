# Desarrollo local. `docker compose up -d` levanta Postgres y Redis.
# `docker compose --profile app up -d --build` añade API y worker en contenedores.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oracle
      POSTGRES_PASSWORD: oracle
      POSTGRES_DB: oracle_odds
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oracle -d oracle_odds']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['app']
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [apps/api/.env]
    environment:
      PROCESS_ROLE: api
      DATABASE_URL: postgresql://oracle:oracle@postgres:5432/oracle_odds?schema=public
      DATABASE_URL_UNPOOLED: postgresql://oracle:oracle@postgres:5432/oracle_odds?schema=public
      REDIS_URL: redis://redis:6379
      ENABLE_SYNC_WORKER: 'false'
    ports: ['3001:3001']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ['app']
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [apps/api/.env]
    environment:
      PROCESS_ROLE: worker
      WORKER_HEALTH_PORT: '3002'
      DATABASE_URL: postgresql://oracle:oracle@postgres:5432/oracle_odds?schema=public
      DATABASE_URL_UNPOOLED: postgresql://oracle:oracle@postgres:5432/oracle_odds?schema=public
      REDIS_URL: redis://redis:6379
      ENABLE_SYNC_WORKER: 'true'
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
